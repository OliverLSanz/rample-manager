[package]
name = "rample-core"
version = "2.0.0"
edition = "2021"

[features]
default = []
native-audio = ["dep:cpal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
crossbeam-channel = "0.5"
natord = "1"
cpal = { version = "0.16", optional = true }

[dev-dependencies]
tempfile = "3"
