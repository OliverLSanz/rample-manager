[package]
name = "rample-core"
version = "3.0.0"
edition = "2021"

[features]
default = []
test-support = []
native-audio = ["dep:cpal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"
crossbeam-channel = "0.5"
symphonia = { version = "0.6.1", default-features = false, features = ["all-meta", "wav", "aiff", "pcm", "adpcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"] }
cpal = { version = "0.16", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
