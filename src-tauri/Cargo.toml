[package]
name = "rample-preview"
version = "2.0.0"
edition = "2021"
default-run = "rample-preview"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rample-core = { path = "../crates/rample-core", features = ["native-audio"] }
notify = "8"
dirs = "6"
dunce = "1"

[dev-dependencies]
tempfile = "3"
rample-core = { path = "../crates/rample-core", features = ["test-support"] }
